<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/logo.svg"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <script>
      // 必须同步执行，不要改成 type="module"：模块脚本是 defer，要等文档解析完才运行，
      // 首帧已经按 :root 的浅色变量绘制，深色用户会先看到白屏再跳成深色。
      // 这里只切 .dark 类，color-scheme 由 src/style.css 的 :root / .dark 跟随；取值规则
      // 与 src/stores/theme.ts 的 useThemeStore 一致（useStorage + useMediaQuery），键名与
      // query 由 theme.spec.ts 校验，改名时那边会失败提醒同步。
      {
        let storedTheme = null
        try {
          storedTheme = window.localStorage.getItem('app.theme')
        } catch {
          // 隐私模式禁用存储时按 system 处理
        }

        const prefersDark =
          storedTheme === 'dark' ||
          (storedTheme !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)

        document.documentElement.classList.toggle('dark', prefersDark)
      }
    </script>
    <script type="module">
      import {
        applyDocumentLanguage,
        resolveInitialLocale,
      } from '/src/plugins/i18n/locales.ts'

      applyDocumentLanguage(resolveInitialLocale())
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
